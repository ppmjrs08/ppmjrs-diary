spring:
  profiles:
    default: demo
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  address: 127.0.0.1
  port: ${PORT:8082}
  servlet:
    session:
      timeout: 20m
      cookie:
        http-only: true
        same-site: strict
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
  global-config:
    banner: false
